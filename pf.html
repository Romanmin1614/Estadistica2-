<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TABLAS</title>
    <link rel="stylesheet" href="pf.css">
</head>
<body>

<div class="contenedor">
    <h1>Buscador de tablas Z, T y Chi-cuadrado</h1>

    <label>Tabla a utilizar:</label>
    <select id="tabla" onchange="cambiarTabla()">
        <option value="z">Tabla Z</option>
        <option value="t">Tabla T Student</option>
        <option value="chi">Tabla Chi-cuadrado</option>
    </select>

    <label>Resultado obtenido con la fórmula:</label>
    <input type="number" id="valorCalculado" step="0.0001" placeholder="Ejemplo: 1.25">

    <div id="grupoGL">
        <label>Grados de libertad:</label>
        <input type="number" id="gl" placeholder="Ejemplo: 9">
    </div>

    <label>Nivel de significancia α:</label>
    <select id="alpha">
        <option value="0.10">0.10</option>
        <option value="0.05" selected>0.05</option>
        <option value="0.025">0.025</option>
        <option value="0.01">0.01</option>
        <option value="0.005">0.005</option>
        <option value="0.001">0.001</option>
    </select>

    <label>Cantidad de colas:</label>
    <select id="colas">
        <option value="una">Una cola</option>
        <option value="dos">Dos colas</option>
    </select>

    <button onclick="calcular()">Calcular</button>
    <button class="limpiar" onclick="limpiar()">Limpiar</button>

    <div id="resultado">
        <h3>Resultado</h3>
        <p>Aquí aparecerá el análisis.</p>
    </div>

    <canvas id="grafica" width="800" height="320"></canvas>
</div>

<script src="pf.js"></script>
</body>
</html>
